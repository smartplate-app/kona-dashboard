<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kona Burger — דשבורד תפעולי</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card2: #222;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --blue: #3b82f6;
    --orange: #f97316;
    --accent: #e8a045;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 1.7rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--muted); font-weight: 400; font-size: 1rem; margin-right: 8px; }
  .header-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month-badge { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font-size: 0.85rem; color: var(--muted); }
  .sync-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 7px 16px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s; }
  .sync-btn:hover { background: var(--accent); color: #000; }
  .sync-btn.loading { opacity: .5; pointer-events: none; }
  .last-sync { font-size: 0.75rem; color: var(--muted); }

  /* PANEL */
  .panel { padding: 16px; max-width: 900px; margin: 0 auto; }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (min-width: 600px) { .kpi-grid { grid-template-columns: repeat(5, 1fr); } }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .kpi-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .kpi-sub { font-size: 0.76rem; color: var(--muted); margin-top: 5px; }
  .kpi-value.accent { color: var(--accent); }
  .kpi-value.yellow { color: var(--yellow); }
  .kpi-value.red { color: var(--red); }
  .kpi-value.green { color: var(--green); }
  .kpi-value.muted { color: var(--muted); }

  /* COST SECTION */
  .cost-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .cost-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
  .cost-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cost-label { font-size: 0.88rem; font-weight: 500; min-width: 130px; }
  .cost-bar-wrap { flex: 1; margin: 0 14px; background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
  .cost-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .cost-bar.labor { background: var(--blue); }
  .cost-bar.food { background: var(--orange); }
  .cost-bar.wolt { background: #25d366; }
  .cost-pct { font-size: 0.95rem; font-weight: 700; min-width: 52px; text-align: left; }
  .cost-pct.green { color: var(--green); }
  .cost-pct.yellow { color: var(--yellow); }
  .cost-pct.red { color: var(--red); }
  .cost-amt { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .total-line { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }
  .total-pct-value { font-size: 1.4rem; font-weight: 800; }

  /* VENDORS */
  .vendors-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .vendors-title { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .vendor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .vendor-name { font-size: 0.85rem; color: #ccc; width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .vendor-bar-wrap { flex: 1; background: #1e1e1e; border-radius: 4px; height: 7px; overflow: hidden; }
  .vendor-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #e8c87a); border-radius: 4px; transition: width 0.7s ease; }
  .vendor-amt { font-size: 0.85rem; color: var(--accent); font-weight: 700; width: 80px; text-align: left; flex-shrink: 0; }
  .vendor-count { font-size: 0.72rem; color: var(--muted); width: 52px; text-align: left; flex-shrink: 0; }

  /* DAILY SALES */
  .daily-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .daily-title { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .daily-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .daily-date { font-size: 0.8rem; color: var(--muted); width: 44px; flex-shrink: 0; }
  .daily-bar-wrap { flex: 1; background: #1e1e1e; border-radius: 4px; height: 8px; overflow: hidden; }
  .daily-bar { height: 100%; background: linear-gradient(90deg, #1a4a7a, #3b82f6); border-radius: 4px; }
  .daily-val { font-size: 0.85rem; font-weight: 700; color: var(--text); width: 80px; text-align: left; flex-shrink: 0; }

  /* PAYWALL */
  #paywall-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:99999; align-items:center; justify-content:center; padding:20px; }
  #paywall-overlay.show { display:flex; }
  .pw-box { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:18px; padding:32px 28px; max-width:380px; width:100%; text-align:center; }
  .pw-logo { font-size:2.8rem; margin-bottom:8px; }
  .pw-title { font-size:1.3rem; font-weight:800; color:var(--accent); margin-bottom:6px; }
  .pw-sub { font-size:0.88rem; color:var(--muted); margin-bottom:20px; line-height:1.6; }
  .pw-input { width:100%; background:#111; border:1px solid #333; border-radius:10px; padding:12px 16px; color:var(--text); font-size:1rem; text-align:center; outline:none; margin-bottom:10px; direction:ltr; }
  .pw-input:focus { border-color:var(--accent); }
  .pw-btn { width:100%; background:var(--accent); color:#000; font-weight:700; font-size:1rem; border:none; border-radius:10px; padding:13px; cursor:pointer; margin-bottom:8px; }
  .pw-btn:hover { opacity:.85; }
  .pw-err { color:var(--red); font-size:0.82rem; margin-top:4px; display:none; }

  /* LOADING */
  .loading-screen { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width: 480px) {
    .logo { font-size: 1.45rem; }
    .kpi-value { font-size: 1.35rem; }
    .kpi-label { font-size: 0.76rem; }
    .cost-label { font-size: 0.85rem; min-width: 100px; }
    .vendor-name { width: 130px; font-size: 0.82rem; }
    .vendor-amt { font-size: 0.82rem; }
    .daily-val { font-size: 0.82rem; }
  }
</style>
</head>
<body>

<!-- PAYWALL -->
<div id="paywall-overlay">
  <div class="pw-box">
    <div class="pw-logo">🍔</div>
    <div class="pw-title">Kona Burger</div>
    <div class="pw-sub">דשבורד תפעולי פנימי<br>נא הזן קוד גישה להמשך</div>
    <input class="pw-input" id="pw-input" type="password" placeholder="קוד גישה" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">כניסה</button>
    <div class="pw-err" id="pw-err">קוד שגוי, נסה שוב</div>
  </div>
</div>

<header>
  <div class="logo">Kona Burger 🍔<span>דשבורד תפעולי</span></div>
  <div class="header-meta">
    <div class="month-badge" id="month-badge">טוען...</div>
    <div class="last-sync" id="last-sync">מתחבר...</div>
    <button class="sync-btn" id="sync-btn" onclick="syncNow()">🔄 סנכרן</button>
  </div>
</header>

<div class="panel" id="main-panel">
  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <div>טוען נתונים...</div>
  </div>
  <div id="content" style="display:none"></div>
</div>

<script>
const SYNC_URL = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaSync';
const TRIGGER_URL = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaTriggerSync';
const CODES = ['KONA2026','SMARTPLATE'];

function fmt(n) {
  if (!n && n !== 0) return '—';
  return '₪' + Math.round(n).toLocaleString('he-IL');
}

function pctColor(p) {
  var v = parseFloat(p);
  if (isNaN(v)) return '';
  if (v > 38) return 'red';
  if (v > 33) return 'yellow';
  return 'green';
}

function totalColor(p) {
  var v = parseFloat(p);
  if (isNaN(v)) return '';
  if (v > 68) return 'red';
  if (v > 62) return 'yellow';
  return 'green';
}

// PAYWALL
function checkPw() {
  var v = document.getElementById('pw-input').value.trim().toUpperCase();
  if (CODES.includes(v)) {
    localStorage.setItem('kona_access', '1');
    document.getElementById('paywall-overlay').classList.remove('show');
    loadDashboard();
  } else {
    var e = document.getElementById('pw-err');
    e.style.display = 'block';
    e.textContent = 'קוד שגוי, נסה שוב';
  }
}

function initPaywall() {
  if (!localStorage.getItem('kona_access')) {
    document.getElementById('paywall-overlay').classList.add('show');
  } else {
    loadDashboard();
  }
}

async function loadDashboard() {
  document.getElementById('loading-screen').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  try {
    var r = await fetch(SYNC_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    var d = await r.json();
    render(d);
  } catch(e) {
    render({});
  }
}

function render(d) {
  document.getElementById('loading-screen').style.display = 'none';

  var months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  var now = new Date();
  document.getElementById('month-badge').textContent = 'MTD ' + months[now.getMonth()] + ' ' + now.getFullYear();
  var upd = d.last_updated ? new Date(d.last_updated).toLocaleString('he-IL') : '—';
  document.getElementById('last-sync').textContent = 'עודכן: ' + upd;

  var salesVat = d.total_sales_vat || 0;
  var salesNet = d.total_sales_net || Math.round(salesVat / 1.18);
  var labor = d.labor_cost || 0;
  var food = d.food_cost_net || 0;
  var wolt = d.wolt_vat || 0;
  var days = d.days_collected || 1;
  var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  var forecast = Math.round(salesVat / days * daysInMonth);

  var laborPct = salesNet > 0 ? (labor / salesNet * 100).toFixed(1) : '0';
  var foodPct  = salesNet > 0 ? (food  / salesNet * 100).toFixed(1) : '0';
  var woltPct  = salesVat > 0 ? (wolt  / salesVat * 100).toFixed(1) : '0';
  var totalPct = salesNet > 0 ? ((labor + food) / salesNet * 100).toFixed(1) : '0';

  var vendors = (d.vendors || []).slice().sort(function(a,b){ return b.amount - a.amount; });
  var maxV = vendors.length > 0 ? vendors[0].amount : 1;

  var dailySales = d.daily_sales || [];
  var maxD = dailySales.length > 0 ? Math.max.apply(null, dailySales.map(function(s){ return s.sales||s.amount||0; })) : 1;

  var html = '';

  // KPI ROW
  html += '<div class="kpi-grid">';
  html += kpi('מכירות MTD ברוטו', fmt(salesVat), days + ' ימים', 'accent');
  html += kpi('מכירות נטו', fmt(salesNet), 'בסיס לאחוזים', 'muted');
  html += kpi('עלות עבודה', fmt(labor), laborPct + '% מנטו', pctColor(laborPct));
  html += kpi('עלות מזון', fmt(food), foodPct + '% מנטו', pctColor(foodPct));
  html += kpi('תחזית חודש', fmt(forecast), 'בקצב הנוכחי', 'muted');
  html += '</div>';

  // COST BARS
  html += '<div class="cost-section">';
  html += '<div class="cost-title">עלויות רשת — מאי 2026</div>';
  html += costRow('עלות עבודה', laborPct, 'labor', labor);
  html += costRow('עלות מזון', foodPct, 'food', food);
  html += costRow('מכירות Wolt', woltPct, 'wolt', wolt);
  html += '<div class="cost-row total-line"><span class="cost-label" style="font-weight:700">סה"כ עבודה + מזון</span><span></span><span class="total-pct-value ' + totalColor(totalPct) + '">' + totalPct + '%</span></div>';
  html += '</div>';

  // VENDORS
  if (vendors.length > 0) {
    html += '<div class="vendors-section">';
    html += '<div class="vendors-title">ספקי מזון — Smart Basic 2 · ' + vendors.length + ' ספקים</div>';
    vendors.forEach(function(v) {
      var pct = maxV > 0 ? Math.round(v.amount / maxV * 100) : 0;
      html += '<div class="vendor-row">' +
        '<div class="vendor-name">' + v.name + '</div>' +
        '<div class="vendor-bar-wrap"><div class="vendor-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="vendor-amt">' + fmt(v.amount) + '</div>' +
        '<div class="vendor-count">' + (v.invoice_count||'') + ' חש\'</div>' +
        '</div>';
    });
    html += '</div>';
  }

  // DAILY SALES
  if (dailySales.length > 0) {
    html += '<div class="daily-section">';
    html += '<div class="daily-title">מכירות יומיות — Tabit Chef</div>';
    dailySales.forEach(function(s) {
      var val = s.sales || s.amount || 0;
      var pct = maxD > 0 ? Math.round(val / maxD * 100) : 0;
      var parts = (s.date||'').split('-');
      var label = parts.length >= 3 ? parts[2] + '/' + parts[1] : (s.date||'');
      html += '<div class="daily-row">' +
        '<div class="daily-date">' + label + '</div>' +
        '<div class="daily-bar-wrap"><div class="daily-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="daily-val">' + fmt(val) + '</div>' +
        '</div>';
    });
    html += '</div>';
  }

  var el = document.getElementById('content');
  el.innerHTML = html;
  el.style.display = 'block';
}

function kpi(label, value, sub, cls) {
  return '<div class="kpi"><div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-value ' + (cls||'') + '">' + value + '</div>' +
    '<div class="kpi-sub">' + sub + '</div></div>';
}

function costRow(label, pct, cls, amt) {
  var barW = Math.min(parseFloat(pct) * 1.4, 100);
  var pc = pctColor(pct);
  if (cls === 'wolt') pc = 'green';
  return '<div class="cost-row"><div style="min-width:130px"><div class="cost-label">' + label + '</div><div class="cost-amt">' + fmt(amt) + '</div></div>' +
    '<div class="cost-bar-wrap"><div class="cost-bar ' + cls + '" style="width:' + barW + '%"></div></div>' +
    '<div class="cost-pct ' + pc + '">' + pct + '%</div></div>';
}

async function syncNow() {
  var btn = document.getElementById('sync-btn');
  btn.classList.add('loading');
  btn.textContent = '⏳ מסנכרן...';
  try {
    await fetch(TRIGGER_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    var tries = 0;
    var interval = setInterval(async function() {
      tries++;
      try {
        var r = await fetch(SYNC_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
        var d = await r.json();
        render(d);
      } catch(e) {}
      if (tries >= 12) {
        clearInterval(interval);
        btn.classList.remove('loading');
        btn.textContent = '🔄 סנכרן';
      }
    }, 5000);
  } catch(e) {
    btn.classList.remove('loading');
    btn.textContent = '🔄 סנכרן';
  }
}

document.addEventListener('DOMContentLoaded', initPaywall);
</script>
</body>
</html>
