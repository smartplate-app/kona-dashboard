<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
<div id="status">טוען...</div>
<div id="result"></div>
<script>
async function test() {
  const el = document.getElementById('status');
  el.textContent = 'מתחיל fetch...';
  try {
    const r = await fetch('https://rosa-6d8ebb9e.base44.app/api/functions/konaSync?_=' + Date.now(), {
      method: 'GET',
      cache: 'no-store'
    });
    el.textContent = 'HTTP ' + r.status;
    const d = await r.json();
    el.textContent = 'ok=' + d.ok + ' vendors=' + (d.vendors||[]).length + ' sales=₪' + d.total_sales_vat;
    document.getElementById('result').textContent = JSON.stringify(d.vendors && d.vendors[0]);
  } catch(e) {
    el.textContent = 'ERROR: ' + e.message;
  }
}
test();
</script>
</body>
</html>
