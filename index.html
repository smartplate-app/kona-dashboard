<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kona Burger — Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:#0d0d1a; color:white; direction:rtl; min-height:100vh; }

/* PAYWALL */
#paywall { position:fixed; inset:0; background:#0d0d1a; display:flex; align-items:center; justify-content:center; z-index:99999; padding:20px; }
.pw-box { background:#16162a; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:36px 28px; max-width:380px; width:100%; text-align:center; }
.pw-title { font-size:22px; font-weight:800; color:white; margin-bottom:6px; }
.pw-branch { font-size:13px; color:#f59e0b; font-weight:700; margin-bottom:6px; }
.pw-sub { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:28px; line-height:1.6; }
.pw-input { width:100%; padding:13px 16px; border-radius:10px; border:1.5px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.07); color:white; font-size:16px; text-align:center; letter-spacing:3px; margin-bottom:12px; outline:none; font-family:inherit; }
.pw-input:focus { border-color:#f59e0b; }
.pw-btn { width:100%; padding:13px; border-radius:10px; border:none; background:linear-gradient(135deg,#92400e,#d97706); color:white; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
.pw-err { color:#f87171; font-size:12px; margin-top:10px; min-height:18px; }

/* LOADING */
#loading { position:fixed; inset:0; background:#0d0d1a; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
.spin { width:36px; height:36px; border:3px solid rgba(255,255,255,0.1); border-top-color:#f59e0b; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { color:rgba(255,255,255,0.4); font-size:13px; }

/* SYNC ERROR MODAL */
#sync-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9998; align-items:center; justify-content:center; }
#sync-modal.show { display:flex; }
.modal-box { background:#1e1e35; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:28px; max-width:340px; width:90%; text-align:center; }
.modal-icon { font-size:32px; margin-bottom:10px; }
.modal-title { font-size:16px; font-weight:800; margin-bottom:8px; }
.modal-msg { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:20px; line-height:1.6; }
.modal-btns { display:flex; gap:10px; }
.modal-sync { flex:1; padding:11px; border-radius:10px; border:none; background:linear-gradient(135deg,#92400e,#d97706); color:white; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.modal-dismiss { flex:1; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:rgba(255,255,255,0.5); font-size:12px; cursor:pointer; font-family:inherit; }

/* HEADER */
.header { background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.h-left { display:flex; align-items:center; gap:12px; }
.h-brand { font-size:20px; font-weight:900; color:white; }
.h-brand span { color:#f59e0b; }
.h-month { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }
.sync-btn { background:#b45309; border:none; color:white; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; }
.sync-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* TABS */
.tabs-bar { display:flex; gap:0; background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); }
.tab-btn { flex:1; padding:12px 0; border:none; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; background:transparent; color:rgba(255,255,255,0.35); border-bottom:3px solid transparent; transition:all 0.2s; }
.tab-btn.active { color:white; border-bottom:3px solid #f59e0b; background:rgba(245,158,11,0.06); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

/* CONTAINER */
.container { max-width:700px; margin:0 auto; padding:14px 12px 40px; }

/* HERO */
.hero { border-radius:16px; padding:20px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
.hero.green  { background:linear-gradient(135deg,#064e3b,#059669); }
.hero.orange { background:linear-gradient(135deg,#78350f,#d97706); }
.hero.red    { background:linear-gradient(135deg,#7f1d1d,#dc2626); }
.hero.gray   { background:linear-gradient(135deg,#1f2937,#374151); }
.hero .big { font-size:38px; font-weight:900; line-height:1; }
.hero .lbl { font-size:11px; opacity:0.65; margin-bottom:4px; }
.hero .sub { font-size:11px; opacity:0.6; margin-top:6px; }
.hero .target { font-size:11px; background:rgba(255,255,255,0.2); border-radius:12px; padding:3px 10px; display:inline-block; margin-top:8px; }

/* KPI */
.kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
@media(min-width:560px){ .kpi-grid { grid-template-columns:repeat(4,1fr); } }
.kpi { background:#16162a; border-radius:12px; padding:14px; border-top:3px solid #333; }
.kpi.sales   { border-top-color:#f59e0b; }
.kpi.net     { border-top-color:#fbbf24; }
.kpi.labor   { border-top-color:#fb923c; }
.kpi.food    { border-top-color:#ef4444; }
.kpi.wolt    { border-top-color:#ff6b35; }
.kpi.total   { border-top-color:#8b5cf6; }
.kpi.days    { border-top-color:#06b6d4; }
.kpi.forecast{ border-top-color:#10b981; }
.kpi-lbl { font-size:9px; color:rgba(255,255,255,0.35); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
.kpi-val { font-size:20px; font-weight:900; color:white; line-height:1.1; }
.kpi-sub { font-size:9px; color:rgba(255,255,255,0.3); margin-top:3px; }
.bar { background:rgba(255,255,255,0.08); border-radius:4px; height:4px; margin-top:7px; overflow:hidden; }
.bf { height:100%; border-radius:4px; }
.bf.green  { background:#10b981; }
.bf.orange { background:#f59e0b; }
.bf.red    { background:#ef4444; }
.bf.amber  { background:#fb923c; }
.bf.wolt   { background:#ff6b35; }

/* SECTION */
.section { background:#16162a; border-radius:12px; padding:16px; margin-bottom:12px; }
.s-title { font-size:10px; font-weight:700; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:12px; }

/* COST ROWS */
.cr { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:8px; margin-bottom:6px; background:rgba(255,255,255,0.04); }
.cr.total-row { background:rgba(245,158,11,0.15); }
.cr .l { font-size:12px; color:rgba(255,255,255,0.6); }
.cr .src { font-size:9px; color:rgba(255,255,255,0.25); margin-top:1px; }
.cr .v { font-size:14px; font-weight:800; color:white; }
.cr.total-row .l { color:white; font-weight:700; }
.cr.total-row .v { color:#f59e0b; font-size:16px; }

/* SUPPLIER GRID */
.sup-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
@media(max-width:480px){ .sup-grid { grid-template-columns:repeat(2,1fr); } }
.sup-box { background:rgba(255,255,255,0.05); border-radius:8px; padding:10px; }
.sup-box .sv { font-size:14px; font-weight:800; color:white; }
.sup-box .sl { font-size:9px; color:rgba(255,255,255,0.35); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sup-box .sc { font-size:9px; color:rgba(255,255,255,0.25); margin-top:2px; }

/* DAILY BARS */
.daily-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:12px; }
.daily-date { width:36px; color:rgba(255,255,255,0.4); }
.daily-bar-wrap { flex:1; height:14px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
.daily-bar { height:100%; background:#f59e0b; border-radius:4px; min-width:2px; }
.daily-val { width:75px; text-align:left; font-weight:700; color:white; font-size:11px; }

/* WOLT CARD */
.wolt-card { background:rgba(255,107,53,0.1); border:1px solid rgba(255,107,53,0.3); border-radius:10px; padding:14px; }

/* FOOTER */
.footer { text-align:center; padding:20px 0 10px; }
.last-upd { font-size:10px; color:rgba(255,255,255,0.2); }

/* NOTE BOX */
.note-box { background:rgba(245,158,11,0.07); border:1px dashed rgba(245,158,11,0.2); border-radius:12px; padding:14px; margin-bottom:12px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center; line-height:1.8; }

/* PCT badge */
.pct { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:700; margin-right:4px; }
.pct.ok  { background:rgba(16,185,129,0.2); color:#10b981; }
.pct.warn { background:rgba(245,158,11,0.2); color:#f59e0b; }
.pct.bad { background:rgba(239,68,68,0.2); color:#ef4444; }
</style>
</head>
<body>

<!-- PAYWALL -->
<div id="paywall">
  <div class="pw-box">
    <div class="pw-title">🍔 Kona Burger</div>
    <div class="pw-branch">דשבורד תפעולי</div>
    <div class="pw-sub">הכנס קוד גישה להמשך</div>
    <input class="pw-input" id="pw-input" type="password" placeholder="קוד גישה" autocomplete="off" />
    <button class="pw-btn" onclick="checkPW()">כניסה</button>
    <div class="pw-err" id="pw-err"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spin"></div>
  <div class="loading-text" id="loading-text">טוען נתונים...</div>
</div>

<!-- SYNC ERROR MODAL -->
<div id="sync-modal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">שגיאת סנכרון</div>
    <div class="modal-msg" id="modal-msg">לא ניתן לטעון נתונים כרגע. ניתן לסנכרן ידנית.</div>
    <div class="modal-btns">
      <button class="modal-sync" onclick="triggerSync()">🔄 סנכרן עכשיו</button>
      <button class="modal-dismiss" onclick="document.getElementById('sync-modal').classList.remove('show')">המשך בכל זאת</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="h-left">
    <div>
      <div class="h-brand">🍔 <span>Kona</span> Burger</div>
      <div class="h-month" id="h-month">טוען...</div>
    </div>
  </div>
  <button class="sync-btn" id="sync-btn" onclick="triggerSync()">🔄 סנכרן</button>
</div>

<!-- TABS -->
<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('may')" id="tab-may">מאי 2026</button>
  <button class="tab-btn" onclick="switchTab('jun')" id="tab-jun">יוני MTD</button>
</div>

<!-- MAY TAB -->
<div class="tab-pane active" id="pane-may">
  <div class="container">
    <div id="may-content"><div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">טוען...</div></div>
  </div>
</div>

<!-- JUN TAB -->
<div class="tab-pane" id="pane-jun">
  <div class="container">
    <div id="jun-content"><div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">טוען...</div></div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const CODES = ['KONA2026','SMARTPLATE'];
const SYNC_URL    = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaSync';
const TRIGGER_URL = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaTriggerSync';

// Smart Basic 2 — Base44 app for food cost
const SB2_APP_ID   = '699c4d19592434b7f867b2c6';
const SB2_ENTITY   = 'SupplyReceipt';
const SB2_USER     = 'konaburgerltd@gmail.com';
const BASE44_API   = 'https://api.base44.com/api/apps/' + SB2_APP_ID + '/entities/' + SB2_ENTITY;

// ─── PAYWALL ──────────────────────────────────────────────────────────────────
(function(){
  if(localStorage.getItem('kona_auth')==='1'){ hidePW(); }
})();
function checkPW(){
  var v=(document.getElementById('pw-input').value||'').trim().toUpperCase();
  if(CODES.includes(v)){ localStorage.setItem('kona_auth','1'); hidePW(); }
  else { document.getElementById('pw-err').textContent='קוד שגוי, נסה שוב'; }
}
document.getElementById('pw-input').addEventListener('keydown',function(e){ if(e.key==='Enter') checkPW(); });
function hidePW(){ document.getElementById('paywall').style.display='none'; loadDashboard(); }

// ─── TAB SWITCH ───────────────────────────────────────────────────────────────
function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('pane-'+t).classList.add('active');
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n){ if(!n&&n!==0) return '—'; return '₪'+Math.round(n).toLocaleString('he-IL'); }
function pctColor(p){ return p<30?'ok':p<35?'warn':'bad'; }
function showLoading(msg){ var l=document.getElementById('loading'); l.style.display='flex'; document.getElementById('loading-text').textContent=msg||'טוען נתונים...'; }
function hideLoading(){ document.getElementById('loading').style.display='none'; }
function showSyncError(msg){ document.getElementById('modal-msg').textContent=msg||'שגיאה בטעינת הנתונים'; document.getElementById('sync-modal').classList.add('show'); }

// ─── FETCH FOOD COST FROM SMART BASIC 2 ───────────────────────────────────────
async function fetchFoodCost(monthPrefix) {
  // monthPrefix e.g. "2026-05" or "2026-06"
  let allRecords = [], skip = 0, hasMore = true;
  while(hasMore) {
    const url = BASE44_API + '?limit=500&skip='+skip+'&created_by='+encodeURIComponent(SB2_USER);
    const r = await fetch(url, { headers:{ 'x-api-key': 'none' } });
    if(!r.ok) throw new Error('Smart Basic 2 fetch failed: '+r.status);
    const data = await r.json();
    const records = data.records || data || [];
    allRecords = allRecords.concat(records);
    hasMore = data.has_more === true && records.length > 0;
    skip += records.length;
    if(records.length === 0) break;
  }

  // Filter current month, exclude refunds & zero totals
  const monthRecords = allRecords.filter(r =>
    (r.invoice_date||'').startsWith(monthPrefix) &&
    !r.is_refund &&
    (r.invoice_total||0) > 0
  );

  // Dedup by (supplier_name, invoice_number) — keep MAX
  const seen = {};
  monthRecords.forEach(r => {
    const key = (r.supplier_name||'') + '||' + (r.invoice_number||'');
    if(!seen[key] || r.invoice_total > seen[key].invoice_total) seen[key] = r;
  });
  const deduped = Object.values(seen);

  // Aggregate by supplier
  const supMap = {};
  let totalNet = 0, totalGross = 0;
  deduped.forEach(r => {
    const gross = r.invoice_total || 0;
    const net   = r.is_zero_vat ? gross : gross / 1.18;
    totalGross += gross;
    totalNet   += net;
    const name = r.supplier_name || 'לא ידוע';
    if(!supMap[name]) supMap[name] = { name, gross:0, net:0, count:0, last_date:'' };
    supMap[name].gross += gross;
    supMap[name].net   += net;
    supMap[name].count += 1;
    if((r.invoice_date||'') > supMap[name].last_date) supMap[name].last_date = r.invoice_date;
  });

  const vendors = Object.values(supMap).sort((a,b)=>b.net-a.net);
  return { totalNet: Math.round(totalNet), totalGross: Math.round(totalGross), vendors, invoiceCount: deduped.length };
}

// ─── MAIN LOAD ────────────────────────────────────────────────────────────────
var gData = null;
var gMayFood = null;
var gJunFood = null;

async function loadDashboard() {
  showLoading('טוען נתוני מכירות ולייבור...');
  const now = new Date();
  const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('h-month').textContent = 'MTD '+monthNames[now.getMonth()]+' '+now.getFullYear();

  try {
    // 1) Fetch konaSync (sales + labor from Tabit Chef cache)
    showLoading('טוען מכירות ולייבור (Tabit Chef)...');
    const syncRes = await fetch(SYNC_URL);
    if(!syncRes.ok) throw new Error('konaSync failed: '+syncRes.status);
    gData = await syncRes.json();

    // 2) Fetch food cost for May and June in parallel from Smart Basic 2
    showLoading('טוען עלות מזון (Smart Basic 2)...');
    const [mayFood, junFood] = await Promise.all([
      fetchFoodCost('2026-05').catch(e=>({ totalNet:0, totalGross:0, vendors:[], invoiceCount:0, error:e.message })),
      fetchFoodCost('2026-06').catch(e=>({ totalNet:0, totalGross:0, vendors:[], invoiceCount:0, error:e.message }))
    ]);
    gMayFood = mayFood;
    gJunFood = junFood;

    hideLoading();
    renderMay();
    renderJun();

  } catch(e) {
    hideLoading();
    showSyncError('שגיאה: '+e.message);
  }
}

// ─── RENDER MAY ───────────────────────────────────────────────────────────────
function renderMay() {
  const d = gData || {};
  const food = gMayFood || {};

  // May data from konaSync (may_* fields or fallback to current if month is May)
  const salesVat = d.may_sales_vat || d.total_sales_vat || 0;
  const salesNet = d.may_sales_net || d.total_sales_net || Math.round(salesVat/1.18);
  const labor    = d.may_labor_cost || d.labor_cost || 0;
  const laborHrs = d.may_labor_hours || d.labor_hours || '';
  const woltVat  = d.may_wolt_vat || d.wolt_vat || 0;
  const days     = d.may_days || d.days_collected || 31;
  const dailySales = d.may_daily_sales || d.daily_sales || [];

  const foodNet  = food.totalNet  || 0;
  const vendors  = food.vendors   || [];

  const laborPct = salesNet>0 ? (labor/salesNet*100).toFixed(1) : 0;
  const foodPct  = salesNet>0 ? (foodNet/salesNet*100).toFixed(1) : 0;
  const woltFee  = Math.round(woltVat * 0.24);
  const woltPct  = salesVat>0 ? (woltVat/salesVat*100).toFixed(1) : 0;
  const totalPct = (+laborPct + +foodPct + +woltPct).toFixed(1);
  const heroClass = totalPct < 63 ? 'green' : totalPct < 67 ? 'orange' : 'red';

  const upd = d.last_updated ? new Date(d.last_updated).toLocaleString('he-IL') : '—';

  document.getElementById('may-content').innerHTML = buildContent({
    salesVat, salesNet, labor, laborHrs, laborPct, foodNet, foodPct,
    woltVat, woltFee, woltPct, totalPct, heroClass, days,
    vendors, dailySales, upd,
    label: 'מאי 2026', isComplete: true
  });
}

// ─── RENDER JUN ───────────────────────────────────────────────────────────────
function renderJun() {
  const d = gData || {};
  const food = gJunFood || {};

  const now = new Date();
  const isJun = now.getMonth() === 5;

  const salesVat = isJun ? (d.total_sales_vat||0) : 0;
  const salesNet = isJun ? (d.total_sales_net||Math.round(salesVat/1.18)) : 0;
  const labor    = isJun ? (d.labor_cost||0) : 0;
  const laborHrs = isJun ? (d.labor_hours||'') : '';
  const woltVat  = isJun ? (d.wolt_vat||0) : 0;
  const days     = isJun ? (d.days_collected||1) : 0;
  const dailySales = isJun ? (d.daily_sales||[]) : [];

  const foodNet  = food.totalNet  || 0;
  const vendors  = food.vendors   || [];

  const laborPct = salesNet>0 ? (labor/salesNet*100).toFixed(1) : 0;
  const foodPct  = salesNet>0 ? (foodNet/salesNet*100).toFixed(1) : 0;
  const woltFee  = Math.round(woltVat * 0.24);
  const woltPct  = salesVat>0 ? (woltVat/salesVat*100).toFixed(1) : 0;
  const totalPct = (+laborPct + +foodPct + +woltPct).toFixed(1);
  const heroClass = totalPct < 63 ? 'green' : totalPct < 67 ? 'orange' : 'red';

  const upd = d.last_updated ? new Date(d.last_updated).toLocaleString('he-IL') : '—';

  if(!isJun || salesVat === 0) {
    document.getElementById('jun-content').innerHTML = `
      <div class="note-box">
        📊 נתוני יוני יעודכנו לאחר הסגירה הראשונה<br>
        <small>עלות מזון: ${foodNet>0 ? fmt(foodNet)+' ('+food.invoiceCount+' חשבוניות)' : 'טרם נקלטו חשבוניות'}</small>
      </div>`;
    return;
  }

  document.getElementById('jun-content').innerHTML = buildContent({
    salesVat, salesNet, labor, laborHrs, laborPct, foodNet, foodPct,
    woltVat, woltFee, woltPct, totalPct, heroClass, days,
    vendors, dailySales, upd,
    label: 'יוני 2026 — MTD', isComplete: false
  });
}

// ─── BUILD CONTENT ────────────────────────────────────────────────────────────
function buildContent(o) {
  const { salesVat, salesNet, labor, laborHrs, laborPct, foodNet, foodPct,
          woltVat, woltFee, woltPct, totalPct, heroClass, days,
          vendors, dailySales, upd, label, isComplete } = o;

  // Hero
  const heroHtml = `
    <div class="hero ${heroClass}">
      <div>
        <div class="lbl">עלויות משולבות — ${label}</div>
        <div class="big">${totalPct}%</div>
        <div class="sub">מזון + עבודה + Wolt</div>
        <div class="target">יעד: מתחת ל-63%</div>
      </div>
      <div style="text-align:left">
        <div style="font-size:24px;font-weight:900;">${fmt(salesVat)}</div>
        <div style="font-size:10px;opacity:0.6;">מכירות ברוטו</div>
        <div style="font-size:13px;font-weight:700;margin-top:4px;">${fmt(salesNet)} נטו</div>
        <div style="font-size:10px;opacity:0.5;">${days} ימים</div>
      </div>
    </div>`;

  // KPIs
  const kpiHtml = `
    <div class="kpi-grid">
      <div class="kpi sales">
        <div class="kpi-lbl">מכירות ברוטו</div>
        <div class="kpi-val">${fmt(salesVat)}</div>
        <div class="kpi-sub">${days} ימים | Tabit Chef</div>
      </div>
      <div class="kpi net">
        <div class="kpi-lbl">מכירות נטו</div>
        <div class="kpi-val">${fmt(salesNet)}</div>
        <div class="kpi-sub">בסיס לחישוב %</div>
      </div>
      <div class="kpi labor">
        <div class="kpi-lbl">עלות עבודה</div>
        <div class="kpi-val">${fmt(labor)}</div>
        <div class="kpi-sub"><span class="pct ${pctColor(+laborPct)}">${laborPct}%</span>${laborHrs ? laborHrs+' שעות' : ''}</div>
        <div class="bar"><div class="bf amber" style="width:${Math.min(+laborPct/50*100,100)}%"></div></div>
      </div>
      <div class="kpi food">
        <div class="kpi-lbl">עלות מזון</div>
        <div class="kpi-val">${fmt(foodNet)}</div>
        <div class="kpi-sub"><span class="pct ${pctColor(+foodPct)}">${foodPct}%</span>Smart Basic 2</div>
        <div class="bar"><div class="bf red" style="width:${Math.min(+foodPct/50*100,100)}%"></div></div>
      </div>
      <div class="kpi wolt">
        <div class="kpi-lbl">מכירות Wolt</div>
        <div class="kpi-val">${fmt(woltVat)}</div>
        <div class="kpi-sub">${woltPct}% מברוטו | עמלה ${fmt(woltFee)}</div>
        <div class="bar"><div class="bf wolt" style="width:${Math.min(+woltPct/30*100,100)}%"></div></div>
      </div>
      <div class="kpi total">
        <div class="kpi-lbl">סה"כ עלויות</div>
        <div class="kpi-val">${totalPct}%</div>
        <div class="kpi-sub"><span class="pct ${+totalPct<63?'ok':+totalPct<67?'warn':'bad'}">${+totalPct<63?'✓ ביעד':'⚠ מעל יעד'}</span></div>
        <div class="bar"><div class="bf ${+totalPct<63?'green':+totalPct<67?'orange':'red'}" style="width:${Math.min(+totalPct/80*100,100)}%"></div></div>
      </div>
    </div>`;

  // Cost breakdown
  const costsHtml = `
    <div class="section">
      <div class="s-title">פירוט עלויות</div>
      <div class="cr">
        <div class="l">עלות עבודה<div class="src">Tabit Chef</div></div>
        <div class="v"><span class="pct ${pctColor(+laborPct)}">${laborPct}%</span>${fmt(labor)}</div>
      </div>
      <div class="cr">
        <div class="l">עלות מזון<div class="src">Smart Basic 2 — חי</div></div>
        <div class="v"><span class="pct ${pctColor(+foodPct)}">${foodPct}%</span>${fmt(foodNet)}</div>
      </div>
      <div class="cr">
        <div class="l">עמלת Wolt (24%)<div class="src">Tabit Chef — Tender Report</div></div>
        <div class="v"><span class="pct warn">${woltPct}%</span>${fmt(woltFee)}</div>
      </div>
      <div class="cr total-row">
        <div class="l">סה"כ עלויות משולבות</div>
        <div class="v">${totalPct}%</div>
      </div>
    </div>`;

  // Suppliers
  const supHtml = vendors.length > 0 ? `
    <div class="section">
      <div class="s-title">ספקים — Smart Basic 2 (${vendors.length} ספקים)</div>
      <div class="sup-grid">
        ${vendors.map(v=>`
          <div class="sup-box">
            <div class="sl">${v.name}</div>
            <div class="sv">${fmt(v.net)}</div>
            <div class="sc">${v.count} חשבוניות</div>
          </div>`).join('')}
      </div>
    </div>` : `
    <div class="note-box">אין נתוני ספקים לחודש זה ב-Smart Basic 2</div>`;

  // Daily sales
  const maxSale = dailySales.length > 0 ? Math.max(...dailySales.map(s=>s.sales||s.amount||0)) : 1;
  const dailyHtml = dailySales.length > 0 ? `
    <div class="section">
      <div class="s-title">מכירות יומיות</div>
      ${dailySales.map(s=>{
        const val = s.sales||s.amount||0;
        const pct2 = maxSale>0?Math.round(val/maxSale*100):0;
        const d2 = (s.date||'').split('-');
        const lbl = d2.length>=3?d2[2]+'/'+d2[1]:s.date||'';
        return `<div class="daily-row">
          <div class="daily-date">${lbl}</div>
          <div class="daily-bar-wrap"><div class="daily-bar" style="width:${pct2}%"></div></div>
          <div class="daily-val">${fmt(val)}</div>
        </div>`;
      }).join('')}
    </div>` : '';

  const footerHtml = `<div class="footer"><div class="last-upd">עודכן: ${upd}</div></div>`;

  return heroHtml + kpiHtml + costsHtml + supHtml + dailyHtml + footerHtml;
}

// ─── SYNC ─────────────────────────────────────────────────────────────────────
async function triggerSync() {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '⏳ מסנכרן...';
  document.getElementById('sync-modal').classList.remove('show');
  try {
    await fetch(TRIGGER_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    // Poll konaSync every 5s up to 60s
    let tries = 0;
    const poll = setInterval(async () => {
      tries++;
      try {
        const r = await fetch(SYNC_URL);
        const d = await r.json();
        if(d.last_updated !== (gData||{}).last_updated || tries > 10) {
          clearInterval(poll);
          gData = d;
          showLoading('מעדכן עלות מזון...');
          const [mf,jf] = await Promise.all([
            fetchFoodCost('2026-05').catch(()=>gMayFood),
            fetchFoodCost('2026-06').catch(()=>gJunFood)
          ]);
          gMayFood = mf; gJunFood = jf;
          hideLoading();
          renderMay(); renderJun();
          btn.disabled = false; btn.textContent = '🔄 סנכרן';
        }
      } catch(e) { clearInterval(poll); btn.disabled=false; btn.textContent='🔄 סנכרן'; }
    }, 5000);
  } catch(e) {
    btn.disabled=false; btn.textContent='🔄 סנכרן';
    showSyncError('סנכרון נכשל: '+e.message);
  }
}
</script>
</body>
</html>
