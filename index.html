var gJulLive = null;

function fmt(n){ 
  if(n==null||isNaN(n)) return '0'; 
  return Math.round(n).toLocaleString('en-US'); 
}

function render(tab, d){
  var html = '';
  var sales = d.total_sales_net || 0;
  
  html += '<div class="kpi-grid">';
  var salesVat = d.total_sales_vat || 0;
  html += '<div class="kpi-card"><div class="kpi-lbl">מכירות ברוטו</div><div class="kpi-val">'+fmt(salesVat)+' ₪</div></div>';
  html += '<div class="kpi-card"><div class="kpi-lbl">מכירות נטו</div><div class="kpi-val">'+fmt(sales)+' ₪</div></div>';
  
  var wolt = d.wolt_vat || 0;
  var woltPct = d.wolt_pct || 0;
  html += '<div class="kpi-card"><div class="kpi-lbl">מכירות וולט</div><div class="kpi-val">'+fmt(wolt)+' ₪</div><div class="kpi-sub">עמלה: '+woltPct.toFixed(1)+'% ממכירות ברוטו</div></div>';
  
  var food = d.food_cost || 0;
  var foodPct = d.food_cost_pct || 0;
  var foodClr = foodPct<=35?'clr-green':foodPct<=40?'clr-orange':'clr-red';
  html += '<div class="kpi-card"><div class="kpi-lbl">עלות מזון נטו</div><div class="kpi-val '+foodClr+'">'+fmt(food)+' ₪</div><div class="kpi-sub">'+foodPct.toFixed(1)+'% ממכירות נטו</div></div>';

  var labor = d.labor_cost || 0;
  var laborPct = d.labor_pct || 0;
  var laborClr = laborPct<=30?'clr-green':laborPct<=35?'clr-orange':'clr-red';
  html += '<div class="kpi-card"><div class="kpi-lbl">עלות שכר (כולל טיפ)</div><div class="kpi-val '+laborClr+'">'+fmt(labor)+' ₪</div><div class="kpi-sub">'+laborPct.toFixed(1)+'% ממכירות נטו</div></div>';
  html += '</div>';

  var primeCost = laborPct + foodPct;
  var pClr = primeCost<=60?'clr-green':primeCost<=65?'clr-orange':'clr-red';
  html += '<div class="prime-box"><div class="pl">Prime Cost (מזון+עבודה)</div><div class="pv '+pClr+'">'+primeCost.toFixed(1)+'%</div><div class="ps">יעד: 60%</div></div>';

  if(d.vendors && d.vendors.length > 0) {
    html += '<div class="section"><div class="s-title">ספקים ('+d.vendors.length+')</div><div class="sup-grid">';
    d.vendors.forEach(function(v){
      var amt = v.amount||v.net||0;
      html += '<div class="sup-box"><div class="sl">'+v.name+'</div><div class="sv">'+fmt(amt)+' ₪</div><div class="sc">'+(v.invoice_count||v.count||'—')+' חשבוניות</div></div>';
    });
    html += '</div></div>';
  }

  var itemsList = tab === 'jul' ? TOP_ITEMS_JUL : TOP_ITEMS_JUN;
  if (itemsList && itemsList.length > 0) {
    var title = tab === 'jul' ? 'הפריטים הנמכרים ביותר (MTD)' : 'הפריטים הנמכרים ביותר (חודש סגור)';
    html += '<div class="section"><div class="s-title">' + title + '</div><div class="sup-grid" style="grid-template-columns:repeat(2,1fr);">';
    itemsList.forEach(function(item) {
      html += '<div class="sup-box"><div class="sl">' + item.name + '</div><div class="sv">' + item.sold + ' יח׳</div><div class="sc">' + fmt(Math.round(item.amountVat)) + ' ₪ ברוטו</div></div>';
    });
    html += '</div></div>';
  }

  var daily = d.daily_sales || (typeof d.daily_sales==='string'?JSON.parse(d.daily_sales):[]);
  if(daily && daily.length>0){
    var maxS=Math.max.apply(null,daily.map(s => s.amount||s.sales||0));
    html+='<div class="section"><div class="s-title">מכירות יומיות</div>';
    daily.forEach(function(s){
      var val=s.amount||s.sales||0;
      var p2=maxS>0?Math.round(val/maxS*100):0;
      var lbl=s.day||((s.date||'').split('-').slice(1).reverse().join('/'));
      html+='<div class="daily-row"><div class="daily-date">'+lbl+'</div><div class="daily-bar-wrap"><div class="daily-bar" style="width:'+p2+'%"></div></div><div class="daily-val">'+fmt(val)+'</div></div>';
    });
    html+='</div>';
  }

  document.getElementById(tab+'-content').innerHTML = html;
}

function showErr(msg){ var el=document.getElementById('modal-msg'); if(el) el.textContent=msg; var sm=document.getElementById('sync-modal'); if(sm) sm.classList.add('show'); }

async function loadFromRosa(){
  try {
    var r = await fetch(SYNC_URL);
    var d = await r.json();
    if(d.total_sales_vat > 0){
      if(!d.vendors || d.vendors.length < 5) d.vendors = DATA.jul ? DATA.jul.vendors : [];
      d.label = 'יולי 2026 — MTD ('+d.days_collected+' ימים) 🟢 Live';
      gJulLive = d;
      render('jul', d);
      var sub = document.getElementById('h-sub');
      if (sub) sub.textContent = 'יוני סגור | יולי MTD';
    }
  } catch(e) {
    if(typeof DATA !== 'undefined' && DATA.jul) render('jul', DATA.jul);
  }
}

async function loadDashboard(){
  var ld = document.getElementById('loading');
  if(ld) ld.style.display='flex';
  render('jun', DATA.jun);
  try {
    await loadFromRosa();
  } catch(e) {
    console.log(e);
  } finally {
    if(ld) ld.style.display='none';
  }
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('pane-'+tab).classList.add('active');
}

async function triggerSync(){
  const overlay = document.getElementById('sync-overlay');
  if(overlay) overlay.style.display = 'flex';
  try {
    await fetch(TRIGGER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    setTimeout(async function() {
      await loadFromRosa();
      if(overlay) overlay.style.display = 'none';
      alert('הנתונים עודכנו בהצלחה!');
    }, 5000);
  } catch(e){
    if(overlay) overlay.style.display = 'none';
    alert('שגיאה בסנכרון הנתונים. נסה שוב מאוחר יותר.');
  }
}

function toggleTheme(){
  var isLight = document.body.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('kona_theme', isLight ? 'light' : 'dark');
}

(function(){
  if(localStorage.getItem('kona_theme')==='light'){
    document.body.classList.add('light');
    document.getElementById('theme-btn').textContent = '🌙';
  }
})();
</script>
