<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kona Burger — דאשבורד MTD</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:#f0f2f5; direction:rtl; min-height:100vh; }
.header {
  background: linear-gradient(135deg, #0a2342 0%, #1a4a7a 100%);
  color: white; padding: 16px 22px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 3px 14px rgba(0,0,0,0.3);
}
.h-title { font-size:20px; font-weight:800; }
.h-sub { font-size:10px; opacity:0.45; margin-top:2px; }
.h-badge { background:rgba(255,255,255,0.13); border:1px solid rgba(255,255,255,0.22); border-radius:18px; padding:5px 14px; font-size:12px; font-weight:700; text-align:center; }
.h-date { font-size:10px; opacity:0.45; margin-top:4px; text-align:center; }
.container { max-width:960px; margin:0 auto; padding:18px 14px; }
.kpi-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.kpi { background:white; border-radius:12px; padding:14px 16px; flex:1; min-width:135px; box-shadow:0 2px 8px rgba(0,0,0,0.07); border-top:4px solid #ddd; }
.kpi.k-sales  { border-top-color:#1a73e8; }
.kpi.k-net    { border-top-color:#0891b2; }
.kpi.k-labor  { border-top-color:#34a853; }
.kpi.k-food   { border-top-color:#ef4444; }
.kpi.k-fore   { border-top-color:#8b5cf6; }
.kpi-lbl { font-size:9px; color:#aaa; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
.kpi-val { font-size:24px; font-weight:800; color:#0a2342; line-height:1.1; }
.kpi-sub { font-size:10px; color:#bbb; margin-top:3px; }
.kpi-pct { margin-top:5px; }
.badge { display:inline-block; padding:2px 8px; border-radius:9px; font-size:10px; font-weight:700; }
.bg { background:#e8f5e9; color:#2e7d32; }
.br { background:#fce4ec; color:#c62828; }
.by { background:#fff8e1; color:#e65100; }
.bb { background:#e3f2fd; color:#1565c0; }
.bar { background:#eee; border-radius:4px; height:6px; margin-top:7px; overflow:hidden; }
.bf  { height:100%; border-radius:4px; }
.section { background:white; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,0.07); margin-bottom:14px; }
.s-title { font-size:12px; font-weight:700; color:#444; margin-bottom:12px; padding-right:9px; border-right:3px solid #1a73e8; }
.two { display:flex; gap:12px; margin-bottom:14px; }
.two > .section { flex:1; margin-bottom:0; }
.row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid #f5f5f5; }
.row:last-child { border-bottom:none; }
.l { font-size:12px; color:#555; }
.v { font-size:13px; font-weight:700; color:#0a2342; }
.src { font-size:9px; color:#bbb; margin-top:2px; }
.day { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #f7f7f7; }
.day:last-child { border-bottom:none; }
.dl { font-size:10px; color:#888; width:54px; flex-shrink:0; }
.dbg { flex:1; background:#f0f0f0; border-radius:4px; height:18px; overflow:hidden; position:relative; }
.dbf { height:100%; border-radius:4px; display:flex; align-items:center; padding-right:5px; font-size:9px; color:white; font-weight:700; min-width:20px; }
.dv { font-size:11px; font-weight:700; color:#0a2342; width:62px; text-align:left; flex-shrink:0; }
.day.today .dl { color:#1a73e8; font-weight:700; }
.sup-grid { display:flex; flex-wrap:wrap; gap:8px; }
.sup-box { background:#f8f9fa; border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; min-width:160px; flex:1; }
.sl { font-size:11px; color:#555; }
.sv { font-size:12px; font-weight:700; color:#0a2342; }
.sync-bar { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:10px; padding:10px 16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.sync-info { font-size:10px; color:#aaa; }
.sync-btn { background:#1a73e8; color:white; border:none; border-radius:8px; padding:6px 14px; font-size:11px; font-weight:700; cursor:pointer; }
.sync-btn:hover { background:#1557b0; }
.loading { text-align:center; padding:60px; color:#aaa; font-size:14px; }
.spinner { display:inline-block; width:32px; height:32px; border:3px solid #eee; border-top-color:#1a73e8; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h-title">🍔 Kona Burger</div>
    <div class="h-sub">דוח חודשי שוטף — MTD</div>
  </div>
  <div class="h-badge">
    <div id="hMonth">טוען...</div>
    <div class="h-date" id="hDays"></div>
  </div>
</div>

<div class="container">
  <div class="sync-bar">
    <div class="sync-info">עודכן לאחרונה: <span id="lastUpdated">—</span></div>
    <button class="sync-btn" onclick="loadData()">🔄 סנכרון</button>
  </div>

  <div id="mainContent">
    <div class="loading">
      <div class="spinner"></div><br>טוען נתונים חיים...
    </div>
  </div>
</div>

<script>
const KONA_SYNC_URL = 'https://rosa-6d8ebb9e.base44.app/functions/konaSync';
const TABIT_CLIENT_ID = 'VbXPFm2RMiq8I2eV7MP4ZQ';
const TABIT_ORG = '64e32dad439d6dbce7f6a622';

function fmt(n) { return '₪' + Math.round(n).toLocaleString('he-IL'); }
function pct(n) { return n.toFixed(1) + '%'; }

async function getTabitLaborLive() {
  try {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const from = `${y}-${m}-01`;
    const to = now.toISOString().split('T')[0];

    const tokenRes = await fetch('https://ros-rp-beta.tabit.cloud/oauth2/token', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({client_id: TABIT_CLIENT_ID, grant_type:'password', username:'konaburgerltd@gmail.com', password:'0311Kona'})
    });
    const tokenData = await tokenRes.json();
    const token = tokenData.access_token;
    if (!token) return null;

    const laborRes = await fetch(`https://ros-rp-beta.tabit.cloud/reports/labor-cost?from=${from}&to=${to}`, {
      headers: {'Authorization': `Bearer ${token}`, 'ros-organization': TABIT_ORG}
    });
    const laborData = await laborRes.json();
    const workers = laborData.laborCost || [];
    const totalCost = workers.reduce((s,w) => s + (w.cost||0), 0);
    const totalHours = workers.reduce((s,w) => s + (w.total||0), 0);
    const workerList = workers
      .sort((a,b) => b.cost - a.cost)
      .map(w => ({name: w.name, role: w.role_name||'', hours: Math.round(w.total*10)/10, cost: Math.round(w.cost)}));
    return { totalCost: Math.round(totalCost), totalHours: Math.round(totalHours*10)/10, workers: workerList };
  } catch(e) { return null; }
}

async function loadData() {
  document.getElementById('lastUpdated').textContent = 'מסנכרן...';
  try {
    const [syncRes, laborLive] = await Promise.all([
      fetch(KONA_SYNC_URL + '?t=' + Date.now()).then(r => r.json()),
      getTabitLaborLive()
    ]);

    const D = syncRes;
    const salesVat = D.sales_vat || 0;
    const salesNet = D.sales_net || 0;
    const dailySales = (D.daily_sales || []).sort((a,b) => a.date.localeCompare(b.date));
    const days = D.days_collected || dailySales.length;
    const avgDaily = days > 0 ? Math.round(salesVat / days) : 0;
    const foodCost = D.food_cost || 0;
    const foodPct = salesNet > 0 ? foodCost / salesNet * 100 : 0;
    const tips = D.tips || 0;
    const tipsPct = salesVat > 0 ? tips / salesVat * 100 : 0;
    const wolt = D.wolt_vat || 0;

    const laborCost = laborLive ? laborLive.totalCost : (D.labor_cost || 0);
    const laborHours = laborLive ? laborLive.totalHours : (D.labor_hours || 0);
    const laborPct = salesVat > 0 ? laborCost / salesVat * 100 : 0;
    const workers = laborLive ? laborLive.workers : [];

    let vendors = [];
    try {
      vendors = Array.isArray(D.vendors) ? D.vendors :
        (typeof D.vendors === 'object' && D.vendors ? Object.entries(D.vendors).map(([k,v])=>({name:k,amount:v})) : []);
    } catch(_) {}

    const now = new Date();
    const monthName = now.toLocaleDateString('he-IL', {month:'long', year:'numeric'});
    document.getElementById('hMonth').textContent = monthName;
    document.getElementById('hDays').textContent = `${days} ימים מתוך ${new Date(now.getFullYear(), now.getMonth()+1,0).getDate()}`;

    // Total costs
    const totalCostPct = laborPct + foodPct;
    const maxSale = Math.max(...dailySales.map(d=>d.sales), 1);

    const DAYS_HE = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

    const html = `
    <!-- KPI row -->
    <div class="kpi-row">
      <div class="kpi k-sales">
        <div class="kpi-lbl">מכירות כולל מע"מ</div>
        <div class="kpi-val">${fmt(salesVat)}</div>
        <div class="kpi-sub">ממוצע יומי ${fmt(avgDaily)}</div>
      </div>
      <div class="kpi k-net">
        <div class="kpi-lbl">מכירות נטו</div>
        <div class="kpi-val">${fmt(salesNet)}</div>
        <div class="kpi-sub">ללא מע"מ 17%</div>
      </div>
      <div class="kpi k-labor">
        <div class="kpi-lbl">עלות עבודה</div>
        <div class="kpi-val">${fmt(laborCost)}</div>
        <div class="kpi-pct"><span class="badge ${laborPct<30?'bg':laborPct<35?'by':'br'}">${pct(laborPct)}</span></div>
        <div class="bar"><div class="bf" style="width:${Math.min(laborPct*2,100)}%;background:#34a853"></div></div>
      </div>
      <div class="kpi k-food">
        <div class="kpi-lbl">עלות מזון</div>
        <div class="kpi-val">${fmt(foodCost)}</div>
        <div class="kpi-pct"><span class="badge ${foodPct<28?'bg':foodPct<33?'by':'br'}">${pct(foodPct)}</span></div>
        <div class="bar"><div class="bf" style="width:${Math.min(foodPct*2,100)}%;background:#ef4444"></div></div>
      </div>
      <div class="kpi k-fore">
        <div class="kpi-lbl">סה"כ עלויות</div>
        <div class="kpi-val">${pct(totalCostPct)}</div>
        <div class="kpi-sub">עבודה + מזון ממכירות</div>
      </div>
    </div>

    <!-- Extra row -->
    <div class="kpi-row">
      <div class="kpi" style="border-top-color:#f59e0b">
        <div class="kpi-lbl">וולט (כולל מע"מ)</div>
        <div class="kpi-val">${fmt(wolt)}</div>
        <div class="kpi-sub">משלוחים</div>
      </div>
      <div class="kpi" style="border-top-color:#8b5cf6">
        <div class="kpi-lbl">טיפים</div>
        <div class="kpi-val">${fmt(tips)}</div>
        <div class="kpi-pct"><span class="badge bb">${pct(tipsPct)} ממכירות</span></div>
      </div>
      <div class="kpi" style="border-top-color:#34a853">
        <div class="kpi-lbl">שעות עבודה</div>
        <div class="kpi-val">${laborHours.toLocaleString()}</div>
        <div class="kpi-sub">שעה ממוצעת: ${laborHours > 0 ? fmt(laborCost/laborHours) : '—'}</div>
      </div>
    </div>

    <div class="two">
      <!-- Cost breakdown -->
      <div class="section">
        <div class="s-title">פירוט עלויות</div>
        <div class="row">
          <div><div class="l">עלות עבודה</div><div class="src">🍳 Tabit Chef · Live</div></div>
          <span class="v">${fmt(laborCost)} &nbsp;<small style="color:#34a853;font-weight:700">${pct(laborPct)}</small></span>
        </div>
        <div class="row">
          <div><div class="l">עלות מזון (ללא מע"מ)</div><div class="src">🧾 Smart Basic 2</div></div>
          <span class="v">${fmt(foodCost)} &nbsp;<small style="color:#e65100;font-weight:700">${pct(foodPct)}</small></span>
        </div>
        <div class="row">
          <div><div class="l">טיפים</div><div class="src">💳 Shift</div></div>
          <span class="v">${fmt(tips)} &nbsp;<small style="color:#8b5cf6;font-weight:700">${pct(tipsPct)} ממכירות</small></span>
        </div>
        <div class="row">
          <div><div class="l">וולט</div></div>
          <span class="v">${fmt(wolt)}</span>
        </div>
      </div>

      <!-- Suppliers -->
      <div class="section">
        <div class="s-title">ספקי מזון — Smart Basic 2</div>
        <div class="sup-grid">
          ${vendors.length > 0 ? vendors.map(v=>`
            <div class="sup-box">
              <div class="sl">${v.name}</div>
              <div class="sv">${fmt(v.amount)}</div>
            </div>`).join('') : '<div style="color:#bbb;font-size:12px">אין נתוני ספקים</div>'}
        </div>
        ${vendors.length > 0 ? `<div style="font-size:10px;color:#999;margin-top:10px">
          סה"כ כולל מע"מ: <strong style="color:#0a2342">≈${fmt(foodCost*1.17)}</strong> &nbsp;·&nbsp; נטו: <strong style="color:#ef4444">${fmt(foodCost)}</strong>
        </div>` : ''}
      </div>
    </div>

    <!-- Daily sales -->
    <div class="section">
      <div class="s-title">מכירות יומיות — ${days} ימים</div>
      ${[...dailySales].reverse().map(d => {
        const dateObj = new Date(d.date + 'T12:00:00');
        const dayHe = DAYS_HE[dateObj.getDay()];
        const dd = String(dateObj.getDate()).padStart(2,'0');
        const mm = String(dateObj.getMonth()+1).padStart(2,'0');
        const pctWidth = Math.round(d.sales / maxSale * 96);
        const color = d.sales >= avgDaily ? '#34a853' : d.sales >= avgDaily*0.9 ? '#f59e0b' : '#ef4444';
        const isToday = d.date === new Date().toISOString().split('T')[0];
        return `<div class="day ${isToday?'today':''}">
          <div class="dl">${dd}/${mm} ${dayHe}</div>
          <div class="dbg"><div class="dbf" style="width:${pctWidth}%;background:${color}"></div></div>
          <div class="dv">${fmt(d.sales)}</div>
        </div>`;
      }).join('')}
    </div>

    <!-- Workers -->
    ${workers.length > 0 ? `
    <div class="section">
      <div class="s-title">פירוט עובדים — Tabit Chef Live (${workers.length} עובדים)</div>
      ${workers.slice(0,15).map(w => `
        <div class="row">
          <div><div class="l">${w.name}</div><div class="src">${w.role} · ${w.hours} שעות</div></div>
          <span class="v">${fmt(w.cost)}</span>
        </div>`).join('')}
      ${workers.length > 15 ? `<div style="font-size:10px;color:#bbb;padding-top:8px">+ ${workers.length-15} עובדים נוספים</div>` : ''}
    </div>` : ''}
    `;

    document.getElementById('mainContent').innerHTML = html;

    const updated = D.last_updated ? new Date(D.last_updated).toLocaleString('he-IL') : 'עכשיו';
    const laborSource = laborLive ? '✅ Tabit Live' : '📦 Rosa';
    document.getElementById('lastUpdated').textContent = `${updated} · עבודה: ${laborSource}`;

  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="loading" style="color:#ef4444">שגיאה בטעינת נתונים: ${e.message}</div>`;
    document.getElementById('lastUpdated').textContent = 'שגיאה';
  }
}

// Load on page open
loadData();
</script>
</body>
</html>
