<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kona Burger — Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:#0d0d1a; color:white; direction:rtl; min-height:100vh; }

#paywall { position:fixed; inset:0; background:#0d0d1a; display:flex; align-items:center; justify-content:center; z-index:99999; padding:20px; }
.pw-box { background:#16162a; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:36px 28px; max-width:380px; width:100%; text-align:center; }
.pw-title { font-size:22px; font-weight:800; color:white; margin-bottom:6px; }
.pw-branch { font-size:13px; color:#f59e0b; font-weight:700; margin-bottom:16px; }
.pw-sub { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:24px; }
.pw-input { width:100%; padding:13px 16px; border-radius:10px; border:1.5px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.07); color:white; font-size:16px; text-align:center; letter-spacing:3px; margin-bottom:12px; outline:none; font-family:inherit; }
.pw-input:focus { border-color:#f59e0b; }
.pw-btn { width:100%; padding:13px; border-radius:10px; border:none; background:linear-gradient(135deg,#92400e,#d97706); color:white; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
.pw-err { color:#f87171; font-size:12px; margin-top:10px; min-height:18px; }

#loading { position:fixed; inset:0; background:#0d0d1a; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
.spin { width:36px; height:36px; border:3px solid rgba(255,255,255,0.1); border-top-color:#f59e0b; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { color:rgba(255,255,255,0.4); font-size:13px; }

#sync-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9998; align-items:center; justify-content:center; }
#sync-modal.show { display:flex; }
.modal-box { background:#1e1e35; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:28px; max-width:340px; width:90%; text-align:center; }
.modal-icon { font-size:32px; margin-bottom:10px; }
.modal-title { font-size:16px; font-weight:800; margin-bottom:8px; }
.modal-msg { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:20px; line-height:1.6; }
.modal-btns { display:flex; gap:10px; }
.modal-sync { flex:1; padding:11px; border-radius:10px; border:none; background:linear-gradient(135deg,#92400e,#d97706); color:white; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.modal-dismiss { flex:1; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:rgba(255,255,255,0.5); font-size:12px; cursor:pointer; font-family:inherit; }

.header { background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.h-brand { font-size:20px; font-weight:900; color:white; }
.h-brand span { color:#f59e0b; }
.h-sub { font-size:11px; color:rgba(255,255,255,0.35); margin-top:2px; }
.sync-btn { background:#b45309; border:none; color:white; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.sync-btn:disabled { opacity:0.5; cursor:not-allowed; }

.tabs-bar { display:flex; background:#16162a; border-bottom:1px solid rgba(255,255,255,0.07); }
.tab-btn { flex:1; padding:12px 0; border:none; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; background:transparent; color:rgba(255,255,255,0.35); border-bottom:3px solid transparent; transition:all 0.2s; }
.tab-btn.active { color:white; border-bottom:3px solid #f59e0b; background:rgba(245,158,11,0.06); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

.container { max-width:700px; margin:0 auto; padding:14px 12px 40px; }

.hero { border-radius:16px; padding:20px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
.hero.green  { background:linear-gradient(135deg,#064e3b,#059669); }
.hero.orange { background:linear-gradient(135deg,#78350f,#d97706); }
.hero.red    { background:linear-gradient(135deg,#7f1d1d,#dc2626); }
.hero.gray   { background:linear-gradient(135deg,#1f2937,#374151); }
.hero .big { font-size:38px; font-weight:900; line-height:1; }
.hero .lbl { font-size:11px; opacity:0.65; margin-bottom:4px; }
.hero .sub { font-size:11px; opacity:0.6; margin-top:6px; }
.hero .target { font-size:11px; background:rgba(255,255,255,0.2); border-radius:12px; padding:3px 10px; display:inline-block; margin-top:8px; }

.kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
@media(min-width:560px){ .kpi-grid { grid-template-columns:repeat(3,1fr); } }
.kpi { background:#16162a; border-radius:12px; padding:14px; border-top:3px solid #333; }
.kpi.sales  { border-top-color:#f59e0b; }
.kpi.net    { border-top-color:#fbbf24; }
.kpi.labor  { border-top-color:#fb923c; }
.kpi.food   { border-top-color:#ef4444; }
.kpi.wolt   { border-top-color:#ff6b35; }
.kpi.total  { border-top-color:#8b5cf6; }
.kpi-lbl { font-size:9px; color:rgba(255,255,255,0.35); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
.kpi-val { font-size:20px; font-weight:900; color:white; line-height:1.1; }
.kpi-sub { font-size:9px; color:rgba(255,255,255,0.3); margin-top:3px; }
.bar { background:rgba(255,255,255,0.08); border-radius:4px; height:4px; margin-top:7px; overflow:hidden; }
.bf { height:100%; border-radius:4px; }
.bf.green  { background:#10b981; }
.bf.orange { background:#f59e0b; }
.bf.red    { background:#ef4444; }
.bf.amber  { background:#fb923c; }
.bf.wolt   { background:#ff6b35; }
.bf.purple { background:#8b5cf6; }

.section { background:#16162a; border-radius:12px; padding:16px; margin-bottom:12px; }
.s-title { font-size:10px; font-weight:700; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:12px; }

.cr { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:8px; margin-bottom:6px; background:rgba(255,255,255,0.04); }
.cr.total-row { background:rgba(245,158,11,0.15); }
.cr .l { font-size:12px; color:rgba(255,255,255,0.6); }
.cr .src { font-size:9px; color:rgba(255,255,255,0.25); margin-top:1px; }
.cr .v { font-size:14px; font-weight:800; color:white; display:flex; align-items:center; gap:6px; }
.cr.total-row .l { color:white; font-weight:700; }
.cr.total-row .v { color:#f59e0b; font-size:16px; }

.sup-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
@media(max-width:480px){ .sup-grid { grid-template-columns:repeat(2,1fr); } }
.sup-box { background:rgba(255,255,255,0.05); border-radius:8px; padding:10px; }
.sup-box .sv { font-size:14px; font-weight:800; color:white; }
.sup-box .sl { font-size:9px; color:rgba(255,255,255,0.35); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sup-box .sc { font-size:9px; color:rgba(255,255,255,0.25); margin-top:2px; }

.daily-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.daily-date { width:36px; color:rgba(255,255,255,0.4); font-size:11px; }
.daily-bar-wrap { flex:1; height:14px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
.daily-bar { height:100%; background:#f59e0b; border-radius:4px; min-width:2px; }
.daily-val { width:70px; text-align:left; font-weight:700; color:white; font-size:11px; }

.pct { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:700; }
.pct.ok   { background:rgba(16,185,129,0.2); color:#10b981; }
.pct.warn { background:rgba(245,158,11,0.2); color:#f59e0b; }
.pct.bad  { background:rgba(239,68,68,0.2); color:#ef4444; }

.note-box { background:rgba(245,158,11,0.07); border:1px dashed rgba(245,158,11,0.2); border-radius:12px; padding:14px; margin-bottom:12px; font-size:11px; color:rgba(255,255,255,0.4); text-align:center; line-height:1.8; }
.footer { text-align:center; padding:16px 0 8px; }
.last-upd { font-size:10px; color:rgba(255,255,255,0.2); }
.live-badge { display:inline-block; background:rgba(16,185,129,0.15); color:#10b981; font-size:9px; padding:2px 7px; border-radius:8px; margin-right:6px; font-weight:700; }
</style>
</head>
<body>

<div id="paywall">
  <div class="pw-box">
    <div class="pw-title">🍔 Kona Burger</div>
    <div class="pw-branch">דשבורד תפעולי</div>
    <div class="pw-sub">הכנס קוד גישה להמשך</div>
    <input class="pw-input" id="pw-input" type="password" placeholder="קוד גישה" autocomplete="off" />
    <button class="pw-btn" onclick="checkPW()">כניסה</button>
    <div class="pw-err" id="pw-err"></div>
  </div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div class="loading-text" id="loading-text">טוען נתונים...</div>
</div>

<div id="sync-modal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">שגיאת סנכרון</div>
    <div class="modal-msg" id="modal-msg">לא ניתן לטעון נתונים כרגע.</div>
    <div class="modal-btns">
      <button class="modal-sync" onclick="triggerSync()">🔄 סנכרן עכשיו</button>
      <button class="modal-dismiss" onclick="document.getElementById('sync-modal').classList.remove('show')">המשך בכל זאת</button>
    </div>
  </div>
</div>

<div class="header">
  <div>
    <div class="h-brand">🍔 <span>Kona</span> Burger</div>
    <div class="h-sub" id="h-sub">מאי סגור | יוני MTD</div>
  </div>
  <button class="sync-btn" id="sync-btn" onclick="triggerSync()">🔄 סנכרן</button>
</div>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('may')" id="tab-may">מאי 2026</button>
  <button class="tab-btn" onclick="switchTab('jun')" id="tab-jun">יוני MTD</button>
</div>

<div class="tab-pane active" id="pane-may">
  <div class="container"><div id="may-content"></div></div>
</div>
<div class="tab-pane" id="pane-jun">
  <div class="container"><div id="jun-content"></div></div>
</div>

<script>
var CODES = ['KONA2026','SMARTPLATE'];
var SYNC_URL    = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaSync';
var TRIGGER_URL = 'https://rosa-6d8ebb9e.base44.app/api/functions/konaTriggerSync';

// ── PAYWALL ──────────────────────────────────────────────────────────────────
function checkPW(){
  var v=(document.getElementById('pw-input').value||'').trim().toUpperCase();
  if(CODES.includes(v)){ localStorage.setItem('kona_auth','1'); hidePW(); }
  else document.getElementById('pw-err').textContent='קוד שגוי';
}
document.getElementById('pw-input').addEventListener('keydown',function(e){ if(e.key==='Enter') checkPW(); });
function hidePW(){ document.getElementById('paywall').style.display='none'; loadDashboard(); }
// Auto-login if already authenticated
document.addEventListener('DOMContentLoaded', function(){
  if(localStorage.getItem('kona_auth')==='1') hidePW();
});

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('pane-'+t).classList.add('active');
}
function fmt(n){ if(!n&&n!==0) return '—'; return '₪'+Math.round(n).toLocaleString('he-IL'); }
function pc(v){ return +v<30?'ok':+v<36?'warn':'bad'; }
function showL(m){ document.getElementById('loading').style.display='flex'; document.getElementById('loading-text').textContent=m||'טוען...'; }
function hideL(){ document.getElementById('loading').style.display='none'; }
function showErr(m){ document.getElementById('modal-msg').textContent=m; document.getElementById('sync-modal').classList.add('show'); }

// ── STATIC DATA — from entity (read directly) ─────────────────────────────────
var MAY_DATA = {
  month:'2026-05', label:'מאי 2026 — סגור',
  total_sales_vat:660589, total_sales_net:559821,
  labor_cost:146996, labor_hours:2824, labor_pct:26.3,
  food_cost_net:198015, food_cost_pct:35.4,
  wolt_vat:46807, days_collected:31,
  last_updated:'2026-06-02T00:02:00Z',
  vendors:[
    {name:'גן המלך',amount:13425,invoice_count:8},
    {name:'ברדא פוראבר',amount:8920,invoice_count:12},
    {name:'דגי נסיב',amount:3894,invoice_count:2}
  ],
  daily_sales:[
    {day:'1/05',amount:25663},{day:'2/05',amount:25186},{day:'3/05',amount:14020},
    {day:'4/05',amount:18561},{day:'5/05',amount:14768},{day:'6/05',amount:17895},
    {day:'7/05',amount:27379},{day:'8/05',amount:27795},{day:'9/05',amount:22845},
    {day:'10/05',amount:17954},{day:'11/05',amount:19941},{day:'12/05',amount:18144},
    {day:'13/05',amount:17036},{day:'14/05',amount:26679},{day:'15/05',amount:25893},
    {day:'16/05',amount:24221},{day:'17/05',amount:15311},{day:'18/05',amount:18874},
    {day:'19/05',amount:20584},{day:'20/05',amount:22038},{day:'21/05',amount:17292},
    {day:'22/05',amount:23824},{day:'23/05',amount:22899},{day:'24/05',amount:15621},
    {day:'25/05',amount:17583},{day:'26/05',amount:21103},{day:'27/05',amount:20240},
    {day:'28/05',amount:27140},{day:'29/05',amount:29837},{day:'30/05',amount:22429},
    {day:'31/05',amount:17568}
  ]
};

// Jun — baseline from Tabit Chef scrape (2/6/2026), will be overridden by konaSync if available
var JUN_BASELINE = {
  month:'2026-06', label:'יוני 2026 — MTD (2 ימים)',
  total_sales_vat:37500, total_sales_net:31780,
  labor_cost:9679, labor_hours:213, labor_pct:30.5,
  food_cost_net:0, food_cost_pct:0,
  wolt_vat:0, days_collected:2,
  last_updated:'2026-06-02T23:50:00Z',
  vendors:[],
  daily_sales:[
    {day:'1/06',amount:21193},
    {day:'2/06',amount:16307}
  ]
};

var gJunLive = null;

async function loadDashboard(){
  // Render IMMEDIATELY from static data — no loading screen
  render('may', MAY_DATA);
  render('jun', JUN_BASELINE);
  var now = new Date();
  document.getElementById('h-sub').textContent = 'עודכן: '+now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();

  // Try live June data in background with short timeout
  try {
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 5000);
    var r = await fetch(SYNC_URL, {signal: ctrl.signal});
    clearTimeout(timer);
    if(r.ok){
      var d = await r.json();
      if(d && d.total_sales_vat > 0){
        gJunLive = d;
        gJunLive.label = 'יוני 2026 — MTD ('+d.days_collected+' ימים) 🟢 Live';
        render('jun', gJunLive);
      }
    }
  } catch(e){
    // Timeout or error — keep baseline, no problem
  }
}

function render(tab, d){
  var el = document.getElementById(tab+'-content');
  var salesVat = d.total_sales_vat||0;
  var salesNet = d.total_sales_net||Math.round(salesVat/1.18);
  var labor    = d.labor_cost||0;
  var laborHrs = d.labor_hours||0;
  var foodNet  = d.food_cost_net||d.food_cost||0;
  var woltVat  = d.wolt_vat||0;
  var days     = d.days_collected||0;
  var laborPct = d.labor_pct||(salesNet>0?labor/salesNet*100:0);
  var foodPct  = d.food_cost_pct||(salesNet>0?foodNet/salesNet*100:0);
  var woltFee  = Math.round(woltVat*0.24);
  var woltPct  = salesVat>0?woltVat/salesVat*100:0;
  var totalPct = +laborPct + +foodPct + +woltPct;
  var heroC    = totalPct===0?'gray':totalPct<70?"green":totalPct<75?"orange":"red";
  var label    = d.label||(tab==='may'?'מאי 2026':'יוני 2026 MTD');
  var upd      = d.last_updated?new Date(d.last_updated).toLocaleString('he-IL'):'—';

  var vendors = d.vendors||[];
  if(typeof vendors==='string'){ try{vendors=JSON.parse(vendors);}catch(e){vendors=[];} }
  if(!Array.isArray(vendors)&&typeof vendors==='object'){
    vendors=Object.entries(vendors).map(function(e){return {name:e[0],amount:e[1],invoice_count:'—'};});
  }
  vendors.sort(function(a,b){return (b.amount||b.net||0)-(a.amount||a.net||0);});

  var daily = d.daily_sales||[];
  if(typeof daily==='string'){ try{daily=JSON.parse(daily);}catch(e){daily=[];} }

  var html='';

  // HERO
  html+='<div class="hero '+heroC+'">';
  html+='<div><div class="lbl">'+label+'</div>';
  html+='<div class="big">'+totalPct.toFixed(1)+'%</div>';
  html+='<div class="sub">מזון + עבודה + Wolt</div>';
  html+='<div class="target">יעד: מתחת ל-70%</div></div>';
  html+='<div style="text-align:left">';
  html+='<div style="font-size:24px;font-weight:900;">'+fmt(salesVat)+'</div>';
  html+='<div style="font-size:10px;opacity:0.6;">מכירות ברוטו</div>';
  html+='<div style="font-size:14px;font-weight:700;margin-top:4px;">'+fmt(salesNet)+' נטו</div>';
  html+='<div style="font-size:10px;opacity:0.5;">'+days+' ימים</div>';
  html+='</div></div>';

  // KPIs
  html+='<div class="kpi-grid">';
  html+=mkKpi('sales','מכירות ברוטו',fmt(salesVat),days+' ימים | Tabit Chef','','');
  html+=mkKpi('net','מכירות נטו',fmt(salesNet),'בסיס לחישוב אחוזים','','');
  html+=mkKpi('labor','עלות עבודה',fmt(labor),'<span class="pct '+pc(+laborPct)+'">'+f1(laborPct)+'%</span> | '+(laborHrs?Math.round(laborHrs)+' שעות':'Tabit Chef'),'amber',Math.min(+laborPct/50*100,100));
  html+=mkKpi('food','עלות מזון',fmt(foodNet),'<span class="pct '+pc(+foodPct)+'">'+f1(foodPct)+'%</span> | Smart Basic 2','red',Math.min(+foodPct/50*100,100));
  html+=mkKpi('wolt','מכירות Wolt',fmt(woltVat),f1(woltPct)+'% | עמלה '+fmt(woltFee),'wolt',Math.min(+woltPct/30*100,100));
  html+=mkKpi('total','סה"כ עלויות',totalPct.toFixed(1)+'%','<span class="pct '+(totalPct<70?'ok':totalPct<75?'warn':'bad')+'">'+(totalPct<70?'✓ ביעד':'⚠ מעל יעד')+'</span>',totalPct<70?"green":totalPct<75?"orange":"red",Math.min(totalPct/90*100,100));
  html+='</div>';

  // Cost breakdown
  html+='<div class="section"><div class="s-title">פירוט עלויות</div>';
  html+=mkCr('עלות עבודה','Tabit Chef',f1(laborPct)+'%',fmt(labor),+laborPct);
  html+=mkCr('עלות מזון','Smart Basic 2',f1(foodPct)+'%',fmt(foodNet),+foodPct);
  html+=mkCr('עמלת Wolt (24%)','Tabit Tender Report',f1(woltPct)+'% ממכירות',fmt(woltFee),-1);
  html+='<div class="cr total-row"><div class="l">סה"כ עלויות</div><div class="v">'+totalPct.toFixed(1)+'%</div></div>';
  html+='</div>';

  // Vendors
  if(vendors.length>0){
    html+='<div class="section"><div class="s-title">ספקים — Smart Basic 2 ('+vendors.length+')</div><div class="sup-grid">';
    vendors.forEach(function(v){
      var amt=v.amount||v.net||0;
      html+='<div class="sup-box"><div class="sl">'+v.name+'</div><div class="sv">'+fmt(amt)+'</div><div class="sc">'+(v.invoice_count||v.count||'—')+' חשבוניות</div></div>';
    });
    html+='</div></div>';
  }

  // Daily
  if(daily.length>0){
    var maxS=Math.max.apply(null,daily.map(function(s){return s.amount||s.sales||0;}));
    html+='<div class="section"><div class="s-title">מכירות יומיות</div>';
    daily.forEach(function(s){
      var val=s.amount||s.sales||0;
      var p2=maxS>0?Math.round(val/maxS*100):0;
      var lbl=s.day||((s.date||'').split('-').slice(1).reverse().join('/'));
      html+='<div class="daily-row"><div class="daily-date">'+lbl+'</div><div class="daily-bar-wrap"><div class="daily-bar" style="width:'+p2+'%"></div></div><div class="daily-val">'+fmt(val)+'</div></div>';
    });
    html+='</div>';
  }

  html+='<div class="footer"><div class="last-upd">עודכן: '+upd+'</div></div>';
  el.innerHTML=html;
}

function f1(n){ return (+n).toFixed(1); }
function mkKpi(cls,lbl,val,sub,barCls,barPct){
  var bar=barCls?'<div class="bar"><div class="bf '+barCls+'" style="width:'+barPct+'%"></div></div>':'';
  return '<div class="kpi '+cls+'"><div class="kpi-lbl">'+lbl+'</div><div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div>'+bar+'</div>';
}
function mkCr(lbl,src,pctStr,valStr,pctVal){
  var cl=pctVal<0?'warn':pctVal<30?'ok':pctVal<36?'warn':'bad';
  return '<div class="cr"><div class="l">'+lbl+'<div class="src">'+src+'</div></div><div class="v"><span class="pct '+cl+'">'+pctStr+'</span>'+valStr+'</div></div>';
}

// ── SYNC ─────────────────────────────────────────────────────────────────────
async function triggerSync(){
  var btn=document.getElementById('sync-btn');
  btn.disabled=true; btn.textContent='⏳...';
  document.getElementById('sync-modal').classList.remove('show');
  try {
    await fetch(TRIGGER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    var prev=gJunLive?gJunLive.last_updated:'';
    var tries=0;
    var poll=setInterval(async function(){
      tries++;
      try{
        var r=await fetch(SYNC_URL);
        var d=await r.json();
        var changed=d.last_updated!==prev||tries>12;
        if(changed){
          clearInterval(poll);
          if(d.total_sales_vat>0){ gJunLive=d; d.label='יוני 2026 — MTD ('+d.days_collected+' ימים) 🟢 Live'; render('jun',d); }
          btn.disabled=false; btn.textContent='🔄 סנכרן';
        }
      }catch(e){ clearInterval(poll); btn.disabled=false; btn.textContent='🔄 סנכרן'; }
    },5000);
  } catch(e){
    btn.disabled=false; btn.textContent='🔄 סנכרן';
    showErr('נכשל: '+e.message);
  }
}
</script>
